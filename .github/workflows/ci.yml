name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/gen_vectors.py --check
      - run: python3 scripts/reference_scan.py
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: '0.10.14+7d59c7ec9'
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- pkg.generated.mbti
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/log-pipeline --target ${{ matrix.target }}
      - run: moon run examples/bench --target ${{ matrix.target }}
      - run: moon run examples/json-pipeline --target ${{ matrix.target }}
      - run: moon run examples/stream-pipeline --target ${{ matrix.target }}
      - name: Report coverage (production gate on native)
        if: matrix.target == 'native'
        run: |
          moon coverage analyze > coverage.txt 2>&1 || true
          tail -1 coverage.txt
          PROD=$(grep -oE '[0-9]+ uncovered line\(s\) in [a-z_]+\.mbt' coverage.txt | grep -v examples | grep -oE '^[0-9]+' | paste -sd+ - | bc)
          echo "production uncovered lines: ${PROD:-0}"
          if [ "${PROD:-0}" -gt 25 ]; then echo "coverage regression"; exit 1; fi
